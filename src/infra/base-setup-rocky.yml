---
- name: Enterprise Base Setup, Dev Tools, Java, Node.js, Fail2ban, and Hardening
  hosts: servers
  become: yes

  tasks:
    - name: Ensure system time synchronization is active
      ansible.builtin.systemd:
        name: chronyd
        state: started
        enabled: yes
      ignore_errors: yes

    - name: Ensure EPEL repository is installed (RHEL/Rocky only)
      ansible.builtin.dnf:
        name: epel-release
        state: present
      when: ansible_os_family == "RedHat"

    - name: Enable CRB repository (Rocky/CentOS 9)
      ansible.builtin.command:
        cmd: dnf config-manager --set-enabled crb
      args:
        creates: /etc/yum.repos.d/centos-crb.repo
      when: ansible_distribution in ['Rocky', 'CentOS']

    - name: Ensure DNF cache is updated
      ansible.builtin.dnf:
        update_cache: yes
      when: ansible_os_family == "RedHat"

    - name: Install Development Tools group
      ansible.builtin.dnf:
        name: "@Development Tools"
        state: present
      when: ansible_os_family == "RedHat"

    - name: Install essential utilities, build tools, and development headers
      ansible.builtin.dnf:
        name:
          - wget
          - vim
          - net-tools
          - bind-utils
          - psmisc
          - unzip
          - gcc
          - gcc-c++
          - make
          - automake
          - autoconf
          - binutils
          - libtool
          - pkg-config
          - zlib
          - zlib-devel
          - readline-devel
          - bzip2
          - bzip2-devel
          - libjpeg-devel
          - libxml2-devel
          - libxslt-devel
          - libevent-devel
          - cyrus-sasl-devel
          - openldap-devel
          - openssl-devel
          - libffi-devel
          - libicu-devel
          - perl
          - perl-IPC-Run
          - perl-ExtUtils-MakeMaker
          - docbook-dtds
          - docbook-xsl
          - docbook-utils
          - opensp
          - openjade
          - xmlto
          - bison
          - flex
          - m4
          - firewalld
          - fail2ban
        state: present
      when: ansible_os_family == "RedHat"

    - name: Install Java Development Kit (JDK)
      ansible.builtin.dnf:
        name: java-latest-openjdk-devel
        state: present
      when: ansible_os_family == "RedHat"

    - name: Add NodeSource repository for Node.js 20
      ansible.builtin.shell: curl -sL https://rpm.nodesource.com/setup_20.x | bash -
      args:
        creates: /etc/yum.repos.d/nodesource-all.repo
      when: ansible_os_family == "RedHat"

    - name: Install Node.js
      ansible.builtin.dnf:
        name: nodejs
        state: present
      when: ansible_os_family == "RedHat"

    - name: Start and enable firewalld and fail2ban
      ansible.builtin.systemd:
        name: "{{ item }}"
        state: started
        enabled: yes
      loop:
        - firewalld
        - fail2ban
      when: ansible_os_family == "RedHat"

    - name: Configure fail2ban jail for SSH defense
      ansible.builtin.copy:
        dest: /etc/fail2ban/jail.local
        content: |
          [DEFAULT]
          bantime = 1h
          findtime = 10m
          maxretry = 5

          [sshd]
          enabled = true
      notify: Restart fail2ban

    - name: OS Hardening - Disable root SSH login and Password Authentication
      ansible.builtin.lineinfile:
        path: /etc/ssh/sshd_config
        regexp: "{{ item.regexp }}"
        line: "{{ item.line }}"
        state: present
      loop:
        - { regexp: '^#?PermitRootLogin', line: 'PermitRootLogin no' }
        - { regexp: '^#?PasswordAuthentication', line: 'PasswordAuthentication no' }
      notify: Restart SSH

    - name: OS Hardening - Enforce secure default umask
      ansible.builtin.lineinfile:
        path: /etc/profile
        regexp: '^umask '
        line: 'umask 027'
        state: present

    - name: OS Hardening - Apply secure kernel parameters (sysctl)
      ansible.builtin.sysctl:
        name: "{{ item.key }}"
        value: "{{ item.value }}"
        state: present
        reload: yes
      loop:
        - { key: 'net.ipv4.conf.all.rp_filter', value: '1' }
        - { key: 'net.ipv4.conf.default.rp_filter', value: '1' }
        - { key: 'net.ipv4.tcp_syncookies', value: '1' }
        - { key: 'net.ipv4.conf.all.accept_source_route', value: '0' }
        - { key: 'net.ipv4.conf.default.accept_source_route', value: '0' }
        - { key: 'net.ipv4.conf.all.accept_redirects', value: '0' }
        - { key: 'net.ipv4.conf.default.accept_redirects', value: '0' }
        - { key: 'fs.protected_hardlinks', value: '1' }
        - { key: 'fs.protected_symlinks', value: '1' }

  handlers:
    - name: Restart SSH
      ansible.builtin.service:
        name: sshd
        state: restarted

    - name: Restart fail2ban
      ansible.builtin.service:
        name: fail2ban
        state: restarted
